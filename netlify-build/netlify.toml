[build]
  publish = "."

# Aggressive cache for the database — it only changes when we rebuild.
# Browsers will keep the 38MB DB for repeat visits, so only the first load is slow.
[[headers]]
  for = "/leadsmart.db"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/vnd.sqlite3"

[[headers]]
  for = "/data.js"
  [headers.values]
    # Always revalidate; the DB file below is immutable so this is the only
    # asset that can change in a deploy. Pay one ~16 KB roundtrip per visit
    # so users always run the current sql.js shim.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
