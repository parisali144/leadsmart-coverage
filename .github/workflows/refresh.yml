name: Daily data refresh

# Fires every day at 14:00 UTC (≈ 9:00 AM EST / 8:00 AM CST + 1 hr,
# giving LeadSmart's 8 AM CST cron a 1-hour buffer to finish).
# Also runnable on demand from the Actions tab via workflow_dispatch.
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  refresh:
    name: Sync from Supabase and deploy to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      NETLIFY_SITE_ID: 021639a8-b4f0-46e6-8017-403569a56e1f

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync LeadSmart top_bids from Supabase
        working-directory: app
        run: |
          python sync_supabase.py
          echo "----"
          ls -lh leadsmart.db

      - name: Verify DB integrity (fail only on catastrophic drop)
        run: |
          # Pull the currently-live DB so we can compare sizes. A healthy daily
          # sync fluctuates a few percent as LeadSmart's live bids change; a
          # truncated fetch collapses to a fraction. We abort only on a drastic
          # drop vs. what's live (or below an absolute sanity floor), so normal
          # shrinkage still deploys. `|| true` — a missing baseline just falls
          # back to the absolute floors below.
          curl -fsS -o live.db \
            "https://leadsmart-coverage.netlify.app/leadsmart.db?nocache=$(date +%s)" || true
          python - <<'PY'
          import sqlite3, os
          def counts(path):
              if not path or not os.path.exists(path):
                  return None, None
              c = sqlite3.connect(path)
              try:
                  n = c.execute('SELECT COUNT(DISTINCT niche) FROM coverage').fetchone()[0]
                  r = c.execute('SELECT COUNT(*) FROM coverage').fetchone()[0]
              except Exception:
                  return None, None
              finally:
                  c.close()
              return n, r

          new_niches, new_rows = counts('app/leadsmart.db')
          live_niches, live_rows = counts('live.db')
          print(f'new:  niches={new_niches}  rows={new_rows}')
          print(f'live: niches={live_niches}  rows={live_rows}')

          # Absolute sanity floors — catch a totally broken sync regardless of baseline.
          assert new_niches is not None and new_niches >= 18, \
              f'Aborting: only {new_niches} niches in DB (expected 18+)'
          assert new_rows is not None and new_rows >= 100_000, \
              f'Aborting: only {new_rows} rows in DB (expected 100k+, likely a truncated fetch)'

          # Relative guard — if a live baseline exists, refuse a catastrophic collapse.
          if live_rows and live_rows > 0:
              ratio = new_rows / live_rows
              print(f'new/live row ratio = {ratio:.3f}')
              assert ratio >= 0.75, (
                  f'Aborting: new DB has {new_rows:,} rows vs {live_rows:,} live '
                  f'({ratio:.1%}) — a >25% drop looks like truncation, not fluctuation.')
          PY

      - name: Stamp DB version into data.js (busts browser cache)
        run: |
          # The data.js shim appends ?v=DB_VERSION to its DB fetch URL. Updating
          # the constant on every build guarantees no user is ever stuck with a
          # stale cached copy from a previous deploy.
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          sed -i "s/const DB_VERSION = '[^']*';/const DB_VERSION = '${STAMP}';/" netlify-build/data.js
          # Same for the index.html script tag, so browsers refetch the new data.js too.
          sed -i "s|data\.js?v=[^\"]*|data.js?v=${STAMP}|" netlify-build/index.html
          echo "Stamped version: ${STAMP}"
          grep -E "DB_VERSION|data.js\?v=" netlify-build/data.js netlify-build/index.html | head -5

      - name: Assemble deploy zip
        run: |
          mkdir -p dist
          cp netlify-build/index.html      dist/
          cp netlify-build/data.js         dist/
          cp netlify-build/netlify.toml    dist/
          cp netlify-build/favicon.svg     dist/
          cp netlify-build/robots.txt      dist/
          cp netlify-build/sitemap.xml     dist/
          cp app/leadsmart.db              dist/
          cd dist
          zip -r9 ../deploy.zip .
          cd ..
          ls -lh deploy.zip

      - name: Deploy to Netlify
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          if [ -z "$NETLIFY_TOKEN" ]; then
            echo "::error::NETLIFY_TOKEN secret is missing. Add it under repo Settings → Secrets → Actions."
            exit 1
          fi
          response=$(curl -fsS -X POST \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys" \
            -H "Authorization: Bearer ${NETLIFY_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary "@deploy.zip")
          echo "$response" | python -c "import sys,json;d=json.load(sys.stdin);print('deploy_id:',d.get('id'));print('state:',d.get('state'));print('url:',d.get('ssl_url'))"

      - name: Verify the live site responds 200
        run: |
          sleep 25
          curl -sSf -o /dev/null -w "homepage: %%{http_code}\n" "https://leadsmart-coverage.netlify.app/"
