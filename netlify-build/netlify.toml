[build]
  publish = "."

# The precomputed JSON API. Every file is fetched with ?v=<deploy-stamp>, so a
# new deploy busts them all at once and same-deploy repeat visits/drill-downs are
# instant from cache. Safe to mark immutable because the URL changes on change.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# data.js carries the deploy stamp that versions every /api fetch, so it must
# always be revalidated — one tiny roundtrip per visit.
[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
