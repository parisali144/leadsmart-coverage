name: Daily data refresh

# Fires every day at 14:00 UTC (≈ 9:00 AM EST / 8:00 AM CST + 1 hr,
# giving LeadSmart's 8 AM CST cron a 1-hour buffer to finish).
# Also runnable on demand from the Actions tab via workflow_dispatch.
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  refresh:
    name: Sync from Supabase and deploy to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NETLIFY_SITE_ID: 021639a8-b4f0-46e6-8017-403569a56e1f

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync LeadSmart top_bids from Supabase
        working-directory: app
        run: |
          python sync_supabase.py
          echo "----"
          ls -lh leadsmart.db

      - name: Verify DB integrity (guard against truncated fetches)
        run: |
          # Truncation = we wrote far fewer rows than the SOURCE actually held.
          # We gate on fetched-vs-source (both recorded in the meta table by the
          # sync), NOT new-vs-live. The old new-vs-live check deadlocked: when it
          # blocked a deploy the live baseline never updated, so the next day's
          # correct data was compared against the same stale-high baseline and
          # failed again — for days, whenever LeadSmart's feed legitimately
          # stepped down ~25%. Source-relative gating is immune to real feed
          # swings and cannot deadlock. Absolute floors still catch a fully
          # broken sync.
          python - <<'PY'
          import sqlite3, os
          p = 'app/leadsmart.db'
          assert os.path.exists(p), 'Aborting: sync produced no DB'
          c = sqlite3.connect(p)
          meta = dict(c.execute('SELECT k, v FROM meta').fetchall())
          niches = c.execute('SELECT COUNT(DISTINCT niche) FROM coverage').fetchone()[0]
          rows   = c.execute('SELECT COUNT(*) FROM coverage').fetchone()[0]
          c.close()

          source = int(meta.get('source_top_bids') or 0)  # Supabase exact count at sync time
          print(f'niches={niches}  coverage_rows={rows:,}  source_top_bids={source:,}')

          # Absolute sanity floors — a totally broken sync fails regardless of source.
          assert niches >= 18, f'Aborting: only {niches} niches (expected 18+)'
          assert rows >= 100_000, \
              f'Aborting: only {rows:,} rows (expected 100k+, likely a truncated fetch)'

          # Source-relative truncation guard. Coverage rows are top_bids minus a
          # few dropped (payout<=0, unmapped vertical/zip), so expect ~0.9-1.0 of
          # source. Anything under 0.85 means the fetch dropped a big chunk.
          if source > 0:
              ratio = rows / source
              print(f'coverage/source ratio = {ratio:.3f}')
              assert ratio >= 0.85, (
                  f'Aborting: wrote {rows:,} rows but source held {source:,} '
                  f'({ratio:.1%}) — fetch looks truncated, not a real feed change.')
          else:
              print('WARNING: source_top_bids missing from meta; skipping ratio gate')
          PY

      - name: Stamp DB version into data.js (busts browser cache)
        run: |
          # The data.js shim appends ?v=DB_VERSION to its DB fetch URL. Updating
          # the constant on every build guarantees no user is ever stuck with a
          # stale cached copy from a previous deploy.
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          sed -i "s/const DB_VERSION = '[^']*';/const DB_VERSION = '${STAMP}';/" netlify-build/data.js
          # Same for the index.html script tag, so browsers refetch the new data.js too.
          sed -i "s|data\.js?v=[^\"]*|data.js?v=${STAMP}|" netlify-build/index.html
          echo "Stamped version: ${STAMP}"
          grep -E "DB_VERSION|data.js\?v=" netlify-build/data.js netlify-build/index.html | head -5

      - name: Assemble deploy zip
        run: |
          mkdir -p dist
          cp netlify-build/index.html      dist/
          cp netlify-build/data.js         dist/
          cp netlify-build/netlify.toml    dist/
          cp netlify-build/favicon.svg     dist/
          cp netlify-build/robots.txt      dist/
          cp netlify-build/sitemap.xml     dist/
          cp app/leadsmart.db              dist/
          cd dist
          zip -r9 ../deploy.zip .
          cd ..
          ls -lh deploy.zip

      - name: Deploy to Netlify
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          if [ -z "$NETLIFY_TOKEN" ]; then
            echo "::error::NETLIFY_TOKEN secret is missing. Add it under repo Settings → Secrets → Actions."
            exit 1
          fi
          response=$(curl -fsS -X POST \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys" \
            -H "Authorization: Bearer ${NETLIFY_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary "@deploy.zip")
          echo "$response" | python -c "import sys,json;d=json.load(sys.stdin);print('deploy_id:',d.get('id'));print('state:',d.get('state'));print('url:',d.get('ssl_url'))"

      - name: Verify the live site responds 200
        run: |
          sleep 25
          curl -sSf -o /dev/null -w "homepage: %%{http_code}\n" "https://leadsmart-coverage.netlify.app/"
